resources:
  jobs:
    gold_sql_refresh_job:
      name: Ampol Hexagon Gold SQL Refresh
      queue:
        enabled: true
      environments:
        - environment_key: serverless
          spec:
            environment_version: "4"
      tasks:
        - task_key: create_reference_tables
          notebook_task:
            notebook_path: ${workspace.file_path}/src/gold/notebooks/create_reference_tables
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              ref_schema: ${var.ref_schema}
              source_path: ${workspace.file_path}/src
              tm_inclusion_volume_path: ${var.tm_inclusion_volume_path}
          environment_key: serverless

        - task_key: gold_sql_pipeline
          depends_on:
            - task_key: create_reference_tables
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_sql_pipeline.id}
            full_refresh: false

        - task_key: create_metric_views
          depends_on:
            - task_key: gold_sql_pipeline
          notebook_task:
            notebook_path: ${workspace.file_path}/src/gold/notebooks/create_metric_views
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              gold_schema: ${var.gold_schema}
              source_path: ${workspace.file_path}/src
          environment_key: serverless
